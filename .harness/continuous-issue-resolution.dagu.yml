# Hand-maintained Dagu counterpart of .made/workflows.yml (wf_mmozh3te_a0828).
description: Continuous Issue Resolution
type: graph
schedule: "0 * * * *"

params:
  - name: project_dir
    type: string
    default: ..
working_dir: ${params.project_dir}

harness:
  provider: opencode
  agent: build

retry_policy:
  limit: 0

steps:
  - id: check_open_issues
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      issues="$(gh issue list --limit 1 --state open)"
      # Keep GitHub errors distinct from an empty issue list; stop before agent calls.
      test -n "$issues" || exit 42

  - id: prepare_main
    depends: [check_open_issues]
    # Preserves the source workflow's destructive cleanup. Use a dedicated checkout.
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      git restore --staged . 2>/dev/null && git restore . && git switch main &&
        git pull --rebase --autostash

  - id: fix_issue
    depends: [prepare_main]
    action: harness.run
    with:
      prompt: >-
        Follow the instructions in @.opencode/commands/prp-issue-fix.md for the
        latest open issue on Github and take its investigation comment as the implementation
        plan, but also check if there is already a linked PR to continue.

  - id: commit_push
    depends: [fix_issue]
    action: harness.run
    with:
      prompt: Follow the instructions in @.opencode/commands/commit-push.md

  - id: resolve_ci_errors
    depends: [commit_push]
    action: harness.run
    with:
      prompt: >-
        Get the latest open Github issue and its linked PR: Only the PR shows
        merge issues follow the instructions in @.opencode/commands/resolve-ci-errors.md

  - id: review_pr
    depends: [resolve_ci_errors]
    action: harness.run
    with:
      prompt: >-
        Get the latest open Github issue and its linked PR: Follow the instructions
        in @.opencode/commands/prp-review.md for the linked PR

  - id: merge_and_notify
    depends: [review_pr]
    action: harness.run
    with:
      prompt: >-
        Get the latest open Github issue and its linked PR: Raise new Github
        issues (and check against present ones) with `gh` CLI if the PR review comments
        came up with high or critical priority findings, failing CI or merge blockers.
        Then, try to merge it. If any PR was processed, send a telegram message on the
        outcome.

  - id: restore_main
    depends: [merge_and_notify]
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      git restore --staged . 2>/dev/null && git restore . && git switch main &&
        git pull --rebase --autostash
