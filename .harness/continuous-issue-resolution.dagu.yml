params:
- name: project_dir
  type: string
  default: ..
- name: harness_args_b64
  type: string
  default: W10=
working_dir: ${params.project_dir}
steps:
- id: decode_payload
  action: js.run
  with:
    input:
      args: ${params.harness_args_b64}
    script: "const scriptEncoded = '';\n\
      function decodeBase64(value) {\n  const pattern = new RegExp(\n    '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'\n\
      \  );\n  if (value.length % 4 !== 0 || !pattern.test(value)) {\n    throw new\
      \ Error('Invalid base64 payload');\n  }\n  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';\n\
      \  let buffer = 0;\n  let bits = 0;\n  let percent = '';\n  for (const char\
      \ of value) {\n    if (char === '=') break;\n    buffer = (buffer << 6) | alphabet.indexOf(char);\n\
      \    bits += 6;\n    if (bits >= 8) {\n      bits -= 8;\n      percent += '%'\
      \ + ((buffer >> bits) & 255).toString(16).padStart(2, '0');\n    }\n  }\n  if\
      \ (bits && (buffer & ((1 << bits) - 1)) !== 0) throw new Error('Invalid base64\
      \ payload');\n  try {\n    return decodeURIComponent(percent);\n  } catch (error)\
      \ {\n    throw new Error('Invalid UTF-8 payload');\n  }\n}\nfunction toOctal(value)\
      \ {\n  // Keep shell and Dagu syntax out of the interpolated file.write content.\n\
      \  const encoded = encodeURIComponent(value);\n  let result = '';\n  for (let\
      \ index = 0; index < encoded.length; index += 1) {\n    let byte;\n    if (encoded[index]\
      \ === '%') {\n      byte = parseInt(encoded.slice(index + 1, index + 3), 16);\n\
      \      index += 2;\n    } else {\n      byte = encoded.charCodeAt(index);\n\
      \    }\n    result += '\\\\' + byte.toString(8).padStart(3, '0');\n  }\n  return\
      \ result;\n}\nconst script = decodeBase64(scriptEncoded);\nconst args = JSON.parse(decodeBase64(input.args));\n\
      if (!Array.isArray(args)) {\n  throw new Error('harness_args_b64 must encode\
      \ an array of strings without NUL');\n}\nif (args.some((item) =>\n  typeof item\
      \ !== 'string' || item.includes('\\0')\n)) {\n  throw new Error('harness_args_b64\
      \ must encode an array of strings without NUL');\n}\nreturn {\n  script: toOctal(script),\n\
      \  argv: toOctal(args.length ? args.join('\\0') + '\\0' : '')\n};\n"
  output:
    payload:
      from: stdout
      decode: json
- id: write_harness
  depends:
  - decode_payload
  action: file.write
  with:
    path: ${context.paths.work_dir}/harness.sh
    content: ${decode_payload.output.payload.script}
    mode: '0700'
    overwrite: true
- id: write_argv
  depends:
  - decode_payload
  action: file.write
  with:
    path: ${context.paths.work_dir}/argv.bin
    content: ${decode_payload.output.payload.argv}
    mode: '0600'
    overwrite: true
- id: execute_harness
  depends:
  - write_harness
  - write_argv
  env:
    ARGV_PATH: ${context.paths.work_dir}/argv.bin
    HARNESS_PATH: ${context.paths.work_dir}/harness.sh
  run: "#!/usr/bin/env bash\nset -euo pipefail\nset --\ndecode_octal() {\n  local\
    \ encoded_path=\"$1\"\n  local decoded_path=\"$2\"\n  local encoded\n  encoded=\"\
    $(<\"$encoded_path\")\"\n  printf '%b' \"$encoded\" > \"$decoded_path\"\n}\ndecode_octal\
    \ \"${env.HARNESS_PATH}\" \"${env.HARNESS_PATH}.decoded\"\nchmod 700 \"${env.HARNESS_PATH}.decoded\"\
    \nmv -f -- \"${env.HARNESS_PATH}.decoded\" \"${env.HARNESS_PATH}\"\ndecode_octal\
    \ \"${env.ARGV_PATH}\" \"${env.ARGV_PATH}.decoded\"\nchmod 600 \"${env.ARGV_PATH}.decoded\"\
    \nmv -f -- \"${env.ARGV_PATH}.decoded\" \"${env.ARGV_PATH}\"\nwhile IFS= read\
    \ -r -d '' argument; do\n  set -- \"$@\" \"$argument\"\ndone < \"${env.ARGV_PATH}\"\
    \nexec bash -- \"${env.HARNESS_PATH}\" \"$@\"\n"
